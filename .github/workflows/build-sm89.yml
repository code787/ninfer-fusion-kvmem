name: build-sm89-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA 13.3
        uses: jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.0'
          method: 'network'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja and vcpkg
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\vcpkg-cache" | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\vcpkg-cache" >> $env:GITHUB_ENV

      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-manifest-v1

      - name: Build ninfer-serve (sm_89, clean dir)
        shell: cmd
        run: |
          set "PATH=%CUDA_PATH%\bin;%PATH%"
          set "CUDACXX=%CUDA_PATH%\bin\nvcc.exe"
          where ninja
          where cl
          cmake -S src-tree\fusion-engine-src -B build-89 -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_CUDA_ARCHITECTURES=89 ^
            -DCMAKE_CUDA_COMPILER="%CUDACXX%" ^
            -DCMAKE_TOOLCHAIN_FILE="%GITHUB_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DNINFER_BUILD_APPS=ON -DBUILD_TESTING=OFF -DNINFER_BUILD_BENCHMARKS=OFF
          if errorlevel 1 exit /b 1
          cmake --build build-89 --target ninfer-serve -j 4

      - name: Collect binary + runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-89\apps\ninfer-serve.exe dist\ninfer-serve-89-streamfix.exe
          $vpkg = "build-89\vcpkg_installed\x64-windows\bin"
          if (Test-Path $vpkg) { Copy-Item "$vpkg\*.dll" dist -ErrorAction SilentlyContinue }
          Get-ChildItem dist | Select-Object Name, Length
          foreach ($d in "cublas64_13.dll","cublasLt64_13.dll") {
            $src = Join-Path $env:CUDA_PATH "bin\$d"
            if ((Test-Path $src) -and -not (Test-Path "dist\$d")) { Copy-Item $src dist }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-serve-89-streamfix
          path: dist\*
